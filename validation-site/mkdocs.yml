site_name: Productive K3S Docs Theme Smoke Test
site_description: Smoke validation site for Productive K3S Docs Theme.
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: ../material-overrides
  language: en
  favicon: assets/images/favicon.ico
  features:
    - navigation.tabs
    - navigation.footer
  palette:
    - scheme: default
      primary: white
      accent: blue
  font: false
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  pk3s:
    footer_slogan_en: "Smoke test for the shared Productive K3S documentation theme."
    footer_slogan_es: "Smoke test para el tema compartido de documentacion de Productive K3S."
    contact_label_en: "Contact"
    contact_label_es: "Contacto"
    newsletter_label_en: "Newsletter"
    newsletter_label_es: "Newsletter"
    newsletter_placeholder_en: "E-mail"
    newsletter_placeholder_es: "E-mail"
    newsletter_api_base_url: "https://newsletter.productive-k3s.io"
    newsletter_success_en: "Thanks for subscribing."
    newsletter_success_es: "Gracias por suscribirte."
    newsletter_duplicate_en: "You are already subscribed."
    newsletter_duplicate_es: "Ya estabas suscripto."
    newsletter_invalid_en: "Enter a valid e-mail address."
    newsletter_invalid_es: "Ingresa un e-mail valido."
    newsletter_error_en: "Could not submit right now. Please try again."
    newsletter_error_es: "No se pudo enviar ahora. Intenta nuevamente."
    argentina_credit_en: "Made in Argentina"
    argentina_credit_es: "Hecho en Argentina"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/productive-k3s/productive-k3s-docs-theme

nav:
  - Home: index.md
